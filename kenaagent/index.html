amentals.pe_ttm", "value": "81.0995 — 高估值，戴维斯双杀隐患"}, {"claim": "", "key": "fundamentals.or_yoy", "value": "-5.9656 — 营收同比负增长，与高估值背离"}, {"claim": "", "key": "fundamentals.pe", "value": "84.0239 — 静态 PE 同样畸高"}, {"claim": "", "key": "technical.rsi14", "value": "91.3082 — RSI 极度超买"}, {"claim": "", "key": "technical.kdj.j", "value": "107.5039 — KDJ J 值远超 100 极度超买"}, {"claim": "", "key": "technical.close", "value": "28.83 / technical.boll.upper=26.0664 — 收盘已破布林上轨"}, {"claim": "", "key": "technical.ma.ma20", "value": "17.7235 — 收盘对 ma20 正乖离约 62.7%"}, {"claim": "已判过松", "key": "technical.ma.ma5", "value": "24.044 — 持有者减仓参考位/结构破位线"}, {"claim": "", "key": "technical.macd.hist", "value": "2.5329 — MACD 红柱高位钝化"}, {"claim": "", "key": "yaogu.hits", "value": "2 — 仅 2/4 命中（precursor+pressure），不足强妖股阈值 3，妖股铁律 position≤15 不触发"}, {"claim": "", "key": "yaogu.clear_top", "value": "true — 连板确认=主升浪走完的负向排除器"}, {"claim": "", "key": "moneyflow.main_net_5d_wan", "value": "8570.43 — 主力净流入系一字锁仓同一现象，非独立利好"}, {"claim": "", "key": "moneyflow.lhb_on_list", "value": "true / lhb_net_amount=5733196.0 — 龙虎榜在榜，游资博弈特征"}, {"claim": "", "key": "moneyflow.northbound_net_yi", "value": "null — 北向缺失[数据缺失]，市场级资金不可判，置信受限"}, {"claim": "", "key": "news", "value": "'深交所披露本周监管动态：对股价异常波动的兴业科技实施重点监控' — 监管利空"}, {"claim": "", "key": "news", "value": "'6连板兴业科技：如未来股票价格进一步上涨 可能向深圳证券交易所申请停牌核查' — 停牌核查风险"}, {"claim": "", "key": "news", "value": "'皮革公司002674，一字涨停！超96万手封单' — 一字锁仓剥夺退出通道"}, {"claim": "", "key": "fundamentals.total_mv", "value": "852073.533(万)=85.2亿 — 中小市值，易被资金操纵/监管点名"}, {"claim": "", "key": "qc.status", "value": "PASS — 论据全部溯源，不触发 UNVERIFIED 强制下调；置信锁中系数据缺失+无 oracle 所致"}]}, {"code": "000823.SZ", "name": "超声电子", "industry": "元器件", "verdict": "SELL", "confidence": "中低", "position_pct": 0, "stop_loss": "新增资金 0 仓不涉及止损。被动持有者：不死守 ma5=24.598（退潮一字板属纸面止损、不可成交），改为开板放量第一流动性窗口无条件清仓；仅当盘中可成交时 ma5(24.598) 作为次级离场参考线、破位即走。止损为情景示意非校准参数。", "horizon": "短线（T+1~T+5）", "yaogu_hits": 2, "key_risks": ["资金口径时点错配（轧空风险）：main_net_5d_wan=82831.55 asof=20260626 早于 06-28 题材证伪，澄清后真实资金/护盘方向未知；lhb_on_list=true 游资主导，若续封可短延伸，0 仓踏空机会成本为已知代价", "T-2 快照+数据双缺失：evidence.asof=20260626，技术/资金全部早于 06-28 证伪；northbound_net_yi=null、yaogu.hotspot=null[数据缺失]，外资方向与板块轮动无法验证", "止损不可成交+量级不可量化：ma5=24.598 为纸面线，退潮一字板无法成交，真实敞口远超名义跌幅；证伪踩踏量级不可预测，止损为情景示意非校准参数"], "analysts": {"technical": "趋势=多头(强势末端·垂直拉升) | 妖股 2/4 (precursor 1.0 / consol 0.0 / hotspot 强题材但已证伪 / pressure 1.0)。MA 完美多头排列且 close 28.46 站上全部 6 均线、破 BOLL 上轨 26.82，MACD 高位金叉，但 RSI14 76.18 与 KDJ J=101.15 双超买极致，近 10 日振幅 45.3% 无横盘蓄势——属\"9天6板\"连板妖股的右侧加速段。题材(英伟达/覆铜板)已被公司 06-28 紧急澄清证伪，且该利空次日反应未纳入 06-26 技术快照(时点错配)。技术状态强，但追高/超买回撤风险同样极致。支撑 MA5=24.598，上方均线无压(clear_top=true)。", "fundamental": "超声电子(000823.SZ) 质地「中」、估值「高估」、不支撑现价。增收不增利+Q1 ROE 仅 0.67%/毛利率 16%/净利-21%，而 PE-TTM 79.2 倍由「9天6板」题材炒作推升、英伟达供货概念已被公司澄清证伪，估值与基本面严重背离；仅资产负债率 35.69% 偏健康。盈利数据报告期为 2026Q1(20260331)，有滞后性。", "news": "催化:中（前期题材催化强、9天6板，但6/28核心传言被公司密集澄清证伪，催化质量转弱）。板块:元器件，英伟达AI供应链/覆铜板/中芯国际概念，有轮动迹象。当前主导消息已由\"题材点火\"切换为\"官方澄清利空\"，高位连板缺乏基本面支撑，证伪后情绪反转风险高。", "sentiment": "资金: 流入但高位分歧 情绪: 亢奋。主力近5日净流入约+8.28亿元、龙虎榜在榜净买入约+4075万元，叠加17.86%极高换手与9天6板，游资主导特征明确、情绪过热；但题材遭公司澄清证伪、换手剧烈意味分歧加大，存在借势出货/踩踏风险。北向数据缺失无法判断市场级配合。"}, "debate": {"bull": ["【维持的多头论点 1·妖股资金在场】截至 evidence 时点，主力近 5 日净流入 main_net_5d_wan=82831.55 万（8.28 亿），龙虎榜在榜 lhb_on_list=true、lhb_net_amount=+4075 万（40751783.06），游资主导且为净买入——资金面 evidence 当下读数是净流入，不是流出。", "【维持的多头论点 2·技术结构完整】close=28.46 站上全部 6 条均线（ma5 24.598→ma250 14.237 完美多头排列），破 BOLL 上轨 26.818，MACD 高位金叉且柱体仍在放大（hist=1.6317，dif 2.3829>dea 1.5671 未背离），yaogu pressure=1.0、clear_top=true 上方无套牢压力。在跌破 ma5=24.598 前，右侧结构 evidence 上未破位。", "【维持的多头论点 3·妖股催化先验仍在】precursor=1.0（22 日涨停 6 次、量峰/中位 1.30x），属真·连板妖股动能样本；news 中 06-26『中芯国际概念涨幅居前』『深股通现身龙虎榜』显示题材并非单一英伟达一条腿，板块轮动载体仍存。", "【驳空头①驱动坍塌】公司澄清的是『无产品供货给英伟达』这一条具体传言（news 06-28），不等于实业基本面恶化：or_yoy=+6.846 营收仍正增长、debt_to_assets=35.69 健康，无退市/财务暴雷硬触发。更关键的是——妖股驱动从来是情绪+资金而非基本面，而 evidence 时点（asof=20260626）的资金读数（8.28 亿净流入）尚未反映澄清后的盘口。澄清利空是否被市场消化必须由次日盘口证实，空头同样拿不出 evidence 证明踩踏已发生，这是对称的 [数据缺失]，不能单算给空头。", "【驳空头②估值背离】承认 pe_ttm=79.245、roe=0.6733、netprofit_yoy=-21.012 严重背离（fundamentals）。但这是范式错配：连板博弈标的由短线情绪定价，PE/DCF 不是其定价锚。A 股无做空机制，『高估』可以变『更高估』，估值高只支撑『不追高』，不支撑『做空』。且 debt_to_assets=35.69、or_yoy 正增长说明这不是财务崩坏的垃圾股，无强制平仓式暴雷路径。", "【驳空头③超买末端 & ④时点错配】rsi14=76.18、kdj j=101.15 确属极致超买（technical），但妖股主升浪超买可连续多日，超买是『动能强』的同义反复，非见顶 evidence 信号；MACD hist 仍放大、无顶背离。空头自承『证伪利空未纳入 06-26 快照』——这把双刃剑同样砍向空头：时点错配让『踩踏/补跌』也只能是 [推测] 而非 evidence 事实。对称之下，多头只需趋势在被盘口证伪前延续即可，举证责任在空头。", "【驳空头⑤高换手+一字跌停尾部】turnover_rate=17.86 高换手是双向解读：既是分歧也是流动性充沛——出货需对手盘，高换手恰说明仍有承接资金。evidence 中无任何封单/跌停/封板数据支撑『即将一字跌停』，该论断是 [推测]；『妖股退潮』是统计先验非该股 evidence。northbound_net_yi 为 [数据缺失]（hsgt 接口异常），市场级配合无法判定，空头不能用缺失项反向坐实利空。", "【诚实边界】本论点为短线博弈级（T+1/数日），非价值投资级；明确承认追高回撤与澄清证伪是真实风险，方向看多但必须配博弈纪律（止损参考 ma5=24.598 破位）。这是仓位/止损问题，不改变『情绪与资金未被盘口证实转向前，短线动能占优』的方向判断。"], "bear": ["【反驳多头①技术形态/右侧加速段/趋势未破】多头把'强势'当'健康'，但 evidence 显示这是最脆弱的垂直拉升末端：close 28.46 已破 BOLL 上轨 26.8181（超出 6.1%）进入统计极端回归区，RSI14=76.18 叠加 KDJ J=101.1454（>100 理论顶）双极致超买，且 yaogu.consolidation subscore=0.0（近10日振幅 45.3%，零横盘蓄势）。close 偏离 MA5(24.598) 达 15.7%、偏离 MA20(19.91) 达 42.9%，乖离率极端、均值回归压力巨大。'趋势未破'是同义反复——连板妖股在破位前永远'未破'，破位当天即一字跌停、无法离场。依据: technical.boll/rsi14/kdj/ma + yaogu.subscores.consolidation=0.0", "【反驳多头②资金共振/主力净流入+8.28亿/游资主导】致命时点错配：moneyflow 全部 date=20260626，而证伪利空 news 集中在 2026-06-28 19:00+、06-29 才进交易日——多头'资金未转向'是用利空发酵前的快照得出，证据失效。且龙虎榜 lhb_net 仅 +4075.18万，仅占主力5日净流入(8.28亿)的 4.9%、相对 17.86% 换手对应的巨额成交微乎其微；龙虎榜上榜+17.86% 高换手本身=游资对倒/分歧加剧的出货特征，非承接信号。北向 northbound_net_yi=null[数据缺失]，机构/市场级配合无证据，多头'共振'缺机构维度。依据: moneyflow.main_net_5d_wan(date=20260626)/lhb_net_amount/turnover_rate=17.8575 + northbound=null", "【反驳多头③题材韧性】这不是'韧性'而是'地基被官方证伪'：news 06-28 三条公告明确'目前公司无产品供货给英伟达''未生产M8、M9覆铜板'——9天6板的核心上涨叙事（英伟达 AI 供应链/覆铜板）被发行人直接否定。yaogu.hotspot subscore=null（单股不可判），多头'题材韧性'本就无 evidence 量化支撑，属[推测]。题材证伪后基本面无法接棒：netprofit_yoy=-21.012%、ROE=0.6733%、grossprofit_margin=15.977%，PE_TTM=79.245 倍纯靠情绪续命，无业绩兜底。依据: news[2026-06-28]×3 + yaogu.hotspot=null + fundamentals.pe_ttm/roe/netprofit_yoy", "【反驳多头核心逻辑'情绪与资金未转向前不构成做空理由'】这是连板妖股博弈的致命逻辑漏洞：①妖股的'转向'是跳跃式的——一字跌停瞬间从亢奋到踩踏，等数据确认转向时已封死跌停、无流动性离场，故'等转向'=亏损确认；②转向的客观触发器（利空澄清）已发生在 06-28，'未转向'只是 06-26 快照的滞后假象而非真实状态；③多头自辩'短线博弈级'，但博弈的核心是赔率与离场流动性——上方空间靠情绪、下方一字跌停无法止损，赔率严重不对称，博弈层面同样应回避。", "【反驳多头④pressure=1.0/clear_top=true 当利多】多头把'上方无套牢盘'读成利好，实则是双刃：在已破上轨+极致超买的背景下，'上方真空'同时意味着'下方无承接盘的真空区'——一旦补跌同样无支撑、加速下行。yaogu 总分仅 2/4（precursor 1.0 + pressure 1.0，而 consolidation=0.0、hotspot 证伪），结构上是'强势末端'而非'蓄势待发'。依据: yaogu.clear_top=true/pressure=1.0/hits=2", "【时点诚实声明】本轮空头核心证据（资金/技术快照 asof=20260626）与利空（news 2026-06-28）存在 ~2 日时差，06-29 盘面尚未纳入 evidence；但这一时差恰恰利空多头——多头所有'未转向'论据均建立在利空前的旧数据上，而空头论点的驱动证伪（公司公告）是已客观发生的硬事实。结论不变：估值无锚(PE_TTM 79.245/ROE 0.67%)+驱动坍塌(英伟达证伪)+超买真空(RSI 76/J 101/破上轨)+离场流动性尾部风险=坚决回避/做空。"], "manager": "看空（短线回避）。多空对\"估值高估、形态完整、超买极致、题材已被官方澄清证伪、游资主导过热\"五点已有共识；真正分歧仅在\"澄清利空与资金方向是否计入前瞻\"。回 evidence 裁定：证伪是已记录事实（计入），踩踏量级未兑现（不计入）；资金净流入数值成立但属 06-26 滞后快照、northbound 缺失；技术\"强与危\"同为硬读数、方向需盘口确认；妖股 2/4 且 consolidation=0.0 为硬伤。综合：驱动证伪 + 零蓄势极致超买 + 估值无锚 压过仅靠动能与滞后资金快照的多头案，新多赔率转负。置信中（偏低），受 evidence 内部时点错配与多项数据缺失拖累。"}, "trader_thesis": "短线看空回避：驱动证伪+极致超买+零蓄势，新多赔率转负。①题材官方证伪——06-28 公司澄清无产品供货英伟达(news.title=紧急澄清:目前无产品供货给英伟达)，9天6板逻辑落空。②估值无锚：pe_ttm=79.25 叠加利润反降(netprofit_yoy=-21.01)。③超买零蓄势：kdj.j=101.15、rsi14=76.18、收盘破布林上轨(close=28.46>boll.upper=26.82)，妖股 consolidation=0.0。④资金属滞后利好：main_net_5d_wan=82831.55 为 06-26 澄清前快照，northbound 缺失[数据缺失]、游资主导(lhb_on_list=true)。证伪叠零蓄势超买压过滞后资金，清仓不参与。", "risk_debate": {"aggressive": "trader 的\"一刀清仓 0%\"对被动持有者过度保守：妖股强趋势+主力 8.28 亿净流入+无压打开仍在场，澄清后资金即时方向未知，0 仓的踏空/轧空机会成本被低估。我不主张买入，但建议被动者保留 10-15% 试错仓博惯性，止损硬挂 ma5=24.598，破位无条件走——比一刀切更有纪律地兼顾机会成本。", "conservative": "认同 trader 的 0 仓位/清仓——在题材官方证伪+9天6板+极致超买零蓄势下，空仓即最优资本保全。但需收紧两点：①trader 给的 ma5(24.60) 止损线在退潮一字板下不可成交，属纸面止损，真实敞口远超 13.6% 名义跌幅；②决策依赖 T-2 快照且北向/板块双缺失，资金面判断不完整。稳健结论：仓位 0%，被动持有者不等 ma5、开板第一时点无条件离场。债务率 35.69% 尚可，风险不在杠杆而在估值/业绩/退潮流动性。", "neutral": "按证据强弱加权后中性裁决：驱动证伪+极致超买+零蓄势压过滞后净流入，新增仓位 EV 为负，拒绝激进方的 10-15% 试错仓；但保守方\"ma5 纸面止损\"的批评成立，被动持有者应在开板放量第一流动性窗口清仓而非死守 ma5。最终：新钱 0%、被动者第一开板离场，不等止损线。"}, "portfolio_decision": "终裁维持 SELL / 新钱 0 仓，采纳保守方+中性方裁决、否决激进方 10-15% 试错仓。核心 SELL 方向稳健且为多方共识：题材 06-28 被公司官方证伪（news「股价三连板！000823，紧急澄清：目前无产品供货给英伟达」），9天6板逻辑落空——决定性看空催化剂为新鲜信息；叠加极致超买（kdj.j=101.1454、rsi14=76.1834、close=28.46 破布林上轨 boll.upper=26.8181）、零蓄势（yaogu.consolidation=0.0、hits 仅 2/4 低于妖股博弈线 3，0 仓与铁律自洽）、估值无锚（pe_ttm=79.245 且 netprofit_yoy=-21.012 利润反降）——新增仓位 EV 为负，驱动证伪叠零蓄势超买压过滞后净流入。对 trader 决策的唯一实质修正：其 ma5=24.598 止损在退潮一字板属纸面线不可成交，改为被动持有者在开板放量第一流动性窗口无条件离场、不等止损线。QC=PASS 未触发置信度强制降档，但 evidence.asof=20260626 为 T-2 快照、技术/资金指标全部早于 06-28 证伪，且 northbound/hotspot 双缺失[数据缺失]，资金面判断不完整，confidence 维持中低；本结论含资金面未溯源缺口须谨慎对待，13 Agent 同源、无样本外 oracle，不构成投资建议。", "qc": {"status": "PASS", "unverified": []}, "evidence_refs": [{"claim": "", "key": "news.title", "value": "「股价三连板！000823，紧急澄清：目前无产品供货给英伟达」(2026-06-28) 题材官方证伪，9天6板逻辑落空"}, {"claim": "", "key": "fundamentals.pe_ttm.value", "value": "79.245 估值无锚"}, {"claim": "", "key": "fundamentals.netprofit_yoy.value", "value": "-21.012 利润同比反降"}, {"claim": "", "key": "technical.kdj.value.j", "value": "101.1454 极致超买 J>100"}, {"claim": "", "key": "technical.rsi14.value", "value": "76.1834 超买"}, {"claim": "", "key": "technical.close.value", "value": "28.46 > technical.boll.value.upper=26.8181 收盘破布林上轨"}, {"claim": "近10日振幅45.3%", "key": "yaogu.value.subscores.consolidation", "value": "0.0 零蓄势"}, {"claim": "", "key": "yaogu.value.hits", "value": "2 仅命中2/4，低于妖股博弈线3"}, {"claim": "asof=20260626", "key": "moneyflow.main_net_5d_wan.value", "value": "82831.55 资金净流入为滞后快照"}, {"claim": "", "key": "moneyflow.northbound_net_yi.value", "value": "null[数据缺失]"}, {"claim": "", "key": "yaogu.value.subscores.hotspot", "value": "null[数据缺失] 板块轮动不可验证"}, {"claim": "", "key": "moneyflow.lhb_on_list.value", "value": "true 游资主导/龙虎榜在榜"}, {"claim": "", "key": "technical.ma.value.ma5", "value": "24.598 被动止损参考线 / ma20=19.91 vs close=28.46 乖离极大"}, {"claim": "", "key": "fundamentals.turnover_rate.value", "value": "17.8575 高换手见顶特征"}, {"claim": "", "key": "evidence.asof", "value": "20260626 决策基于 T-2 快照"}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const $ = (s,el=document)=>el.querySelector(s);
const ce=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const CONF_ORD={'高':5,'中高':4,'中':3,'中低':2,'低':1};
const VORD={BUY:4,HOLD:3,SELL:2,AVOID:1};

// header
$('#h-title').textContent='kenaagent · A股个股对抗式研判看板';
const sub=$('#h-sub');
[['基准日',DATA.asof],['情绪相位',DATA.sentiment_phase],['universe',DATA.universe_source],['引擎','13-agent 多空辩论 + QC门 + 三方风控终裁']].forEach(([k,v])=>{
 const p=ce('span','pill');p.append(k+'：');const b=ce('b',null,v);p.append(b);sub.append(p);
});
// banner (textContent — no html injection)
$('#disc').textContent=DATA.disclaimer||'';
// note
const note=$('#note');
if(DATA.top3_note){note.textContent='⚠ '+DATA.top3_note;}else{note.style.display='none';}

// top3
const t3=$('#top3');
DATA.top3_buy_next_day.forEach(t=>{
 const c=ce('div','tc r'+t.rank);
 const rk=ce('div','rk');const medal=['','金','银','铜'][t.rank]||'';
 rk.innerHTML='';const rkb=ce('b','r'+t.rank+'b',(medal?medal+'榜 ':'')+'#'+t.rank);rk.append(rkb);
 c.append(rk);
 c.append(ce('div','nm',t.name));
 c.append(ce('div','cd',t.code));
 const comp=ce('div','comp');comp.append(String(t.composite));const sm=ce('small',null,' /100');comp.append(sm);c.append(comp);
 const meta=ce('div','meta');
 const vb=ce('span','vb '+t.verdict,t.verdict);meta.append(vb);
 const kss=ce('span','kss','kensss '+t.kensss_pct+'%');meta.append(kss);
 c.append(meta);
 c.append(ce('div','reason',t.reason||''));
 t3.append(c);
});

// chips
let filt='ALL';
const chipDefs=[['ALL','全部'],['BUY','BUY'],['HOLD','HOLD'],['SELL','SELL'],['AVOID','AVOID']];
const chipWrap=$('#chips');
chipDefs.forEach(([k,lbl])=>{
 const n=DATA.stocks.filter(s=>k==='ALL'||s.verdict===k).length;
 const ch=ce('div','chip'+(k==='ALL'?' on':''),lbl+' ('+n+')');ch.dataset.k=k;
 ch.onclick=()=>{filt=k;[...chipWrap.children].forEach(x=>x.classList.toggle('on',x.dataset.k===k));render();};
 chipWrap.append(ch);
});

// sort state
let sortK='confidence',sortDir=-1;
$('#tbl thead').addEventListener('click',e=>{
 const th=e.target.closest('th');if(!th||!th.dataset.k)return;
 const k=th.dataset.k;
 if(k===sortK)sortDir*=-1;else{sortK=k;sortDir=-1;}
 render();
});
function sval(s,k){
 if(k==='confidence')return CONF_ORD[s.confidence]||0;
 if(k==='verdict')return VORD[s.verdict]||0;
 if(k==='position_pct')return s.position_pct||0;
 if(k==='yaogu_hits')return s.yaogu_hits||0;
 if(k==='code')return s.code;
 return (s[k]||'')+'';
}
function render(){
 const tb=$('#tbody');tb.innerHTML='';
 let rows=DATA.stocks.filter(s=>filt==='ALL'||s.verdict===filt);
 rows.sort((a,b)=>{const x=sval(a,sortK),y=sval(b,sortK);return (x>y?1:x<y?-1:0)*sortDir;});
 rows.forEach(s=>{
  const tr=ce('tr','row');tr.onclick=()=>openModal(s.code);
  // name
  const td1=ce('td');td1.dataset.l='代码·名称';const nc=ce('div','nmcell');nc.append(ce('b',null,s.name));nc.append(ce('span',null,s.code+' · '+(s.industry||'—')));td1.append(nc);tr.append(td1);
  // verdict
  const td2=ce('td');td2.dataset.l='终裁';td2.append(ce('span','vb '+s.verdict,s.verdict));tr.append(td2);
  // conf
  const td3=ce('td');td3.dataset.l='置信';td3.className='conf';td3.textContent=s.confidence||'—';tr.append(td3);
  // pos
  const td4=ce('td');td4.dataset.l='仓位';td4.innerHTML='';const pb=ce('b',null,(s.position_pct||0)+'%');pb.style.color=(s.position_pct>0?'var(--blue)':'var(--tMuted)');td4.append(pb);tr.append(td4);
  // stop
  const td5=ce('td');td5.dataset.l='止损';td5.className='risk';td5.textContent=trunc(s.stop_loss,60);tr.append(td5);
  // yaogu
  const td6=ce('td');td6.dataset.l='妖股';const yh=ce('div','yh');for(let i=0;i<4;i++){const d=ce('i');if(i<(s.yaogu_hits||0))d.className='on';yh.append(d);}td6.append(yh);const yt=ce('span',null,' '+(s.yaogu_hits||0)+'/4');yt.style.fontSize='10px';yt.style.color='var(--tLight)';td6.append(yt);tr.append(td6);
  // risk
  const td7=ce('td');td7.dataset.l='关键风险';td7.className='risk';td7.textContent=trunc((s.key_risks||[])[0]||'—',70);tr.append(td7);
  // exp
  const td8=ce('td');td8.append(ce('span','exp','展开 →'));tr.append(td8);
  tb.append(tr);
 });
 if(!rows.length){const tr=ce('tr');const td=ce('td');td.colSpan=8;td.style.textAlign='center';td.style.padding='22px';td.style.color='var(--tMuted)';td.textContent='无该评级股票';tr.append(td);tb.append(tr);}
}
function trunc(t,n){t=(t||'')+'';return t.length>n?t.slice(0,n)+'…':t;}

const DOMN={technical:'技术面',fundamentals:'基本面',moneyflow:'资金面',yaogu:'妖股要件',news:'消息面',qc:'QC',evidence:'声明',basic:'基础'};
function openModal(code){
 const s=DATA.stocks.find(x=>x.code===code);if(!s)return;
 const m=$('#modal');m.innerHTML='';
 const hd=ce('div','mhead');
 const hl=ce('div');const h2=ce('h2',null,s.name+' · '+s.code);hl.append(h2);
 const mi=ce('div','mi',(s.industry||'—')+' ｜ 终裁 '+s.verdict+' ｜ 置信 '+(s.confidence||'—')+' ｜ 仓位 '+(s.position_pct||0)+'% ｜ 周期 '+trunc(s.horizon,40));
 hl.append(mi);hd.append(hl);
 const x=ce('button','mx','×');x.onclick=closeModal;hd.append(x);
 m.append(hd);
 const bd=ce('div','mbody');
 // top row badges
 const mr=ce('div','mrow');
 mr.append(badge('终裁', null, ()=>{const e=ce('span','vb '+s.verdict,s.verdict);return e;}));
 const qc=ce('span','qcb '+(s.qc&&s.qc.status||'PASS'),'QC '+(s.qc&&s.qc.status||'PASS')+(s.qc&&s.qc.unverified&&s.qc.unverified.length?(' · 未通过'+s.qc.unverified.length+'条'):''));
 mr.append(qc);
 [['止损纪律',trunc(s.stop_loss,90)],['持有周期',trunc(s.horizon,70)],['妖股命中',(s.yaogu_hits||0)+'/4']].forEach(([k,v])=>{
